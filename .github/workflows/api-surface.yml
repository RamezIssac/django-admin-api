name: API surface

# Public names of admin_api added, removed or changed by a PR; advisory (see CONTRIBUTING.md).
# PR comment (pr-comment.yml) posts api-surface/comment.md on the PR.
on:
  pull_request:

concurrency:
  group: api-surface-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: origin/${{ github.base_ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/api_surface.py "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: api-surface/comment.md
          retention-days: 1
