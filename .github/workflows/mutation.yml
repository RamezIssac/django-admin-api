name: Mutation

# Mutation testing of the lines a PR changed; report only (see CONTRIBUTING.md).
on:
  pull_request:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_COLOR: "1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ github.head_ref }}-
            mutmut-
      - run: uv run --with mutmut==3.8.1 python scripts/mutate_changed.py "origin/${{ github.base_ref }}"
      - if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 mutants/report.md > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file comment.md
