name: Mutation

# Mutation testing of the lines a PR changed; report only (see CONTRIBUTING.md).
# PR comment (pr-comment.yml) posts mutants/comment.md on the PR.
on:
  pull_request:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.13"
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ github.head_ref }}-
            mutmut-
      - run: uv run --with mutmut==3.8.1 python scripts/mutate_changed.py "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: mutants/comment.md
          retention-days: 1
