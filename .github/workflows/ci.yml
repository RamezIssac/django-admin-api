name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # reused by release.yml so a tag can only publish what CI passed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx nox -s lint

  # The matrix comes from noxfile.py: one job per `tests(...)` session.
  sessions:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - id: list
        run: |
          tests=$(uvx nox -l --json -s tests | jq -c '[.[].session]')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "$tests" | jq .

  tests:
    needs: sessions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.sessions.outputs.tests) }}
    name: ${{ matrix.session }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            noxfile.py
      # uv downloads the Python each session asks for (3.10 / 3.12 / 3.13).
      - run: uvx nox -s "${{ matrix.session }}"

  # Mutation testing of the lines a PR changed; report only (see CONTRIBUTING.md).
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ github.head_ref }}-
            mutmut-
      - run: uv run --with mutmut==3.8.1 python scripts/mutate_changed.py "origin/${{ github.base_ref }}"
      - if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 mutants/report.md > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file comment.md
