[project]
# NOTE: "django-admin-api" is already taken on PyPI; final distribution name TBD.
name = "django-admin-api"
version = "0.0.1"
description = "A thin layer that makes Django ModelAdmin API- and MCP-ready, driven by api_ twins."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ramez Ashraf" }]
requires-python = ">=3.10"
dependencies = ["django>=4.2"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
# MCP transports (Streamable HTTP view, manage.py mcp_serve). The tool layer needs nothing extra.
mcp = ["mcp>=2.3,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["admin_api"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    # optional integration (admin_api.contrib.subadmin); tests skip without it
    "django-subadmin>=5.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["conformance: official MCP client against the real transports (live server, subprocess)"]

[tool.ruff]
line-length = 120
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
extend-ignore = ["RUF012"]  # Django declares list_display etc. as mutable class attributes
