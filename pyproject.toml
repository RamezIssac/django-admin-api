[project]
# Published as "django-admin-api-mcp": "django-admin-api" is taken on PyPI by an unrelated,
# inactive package. The import package stays `admin_api` (see the README).
name = "django-admin-api-mcp"
version = "0.1.0a3"
description = "MCP-ready Django admin: a REST API and an MCP server for AI agents from your existing ModelAdmins, driven by api_ twins."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ramez Ashraf" }]
keywords = ["django", "admin", "rest", "api", "mcp", "model-context-protocol", "ai-agents"]
requires-python = ">=3.10"
dependencies = ["django>=4.2", "mcp>=2.3,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/RamezIssac/django-admin-api"
Documentation = "https://github.com/RamezIssac/django-admin-api#readme"
Repository = "https://github.com/RamezIssac/django-admin-api"
Issues = "https://github.com/RamezIssac/django-admin-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["admin_api"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "jsonschema>=4.20",
    # optional integration (admin_api.contrib.subadmin); tests skip without it
    "django-subadmin>=5.2",
    "pillow>=12.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["conformance: official MCP client against the real transports (live server, subprocess)"]

[tool.ruff]
line-length = 120
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
extend-ignore = ["RUF012"]  # Django declares list_display etc. as mutable class attributes
